name: poll-funbox

on:
  schedule:
    - cron: "*/5 * * * *" # GitHub 最短每 5 分鐘一次(尖峰時段可能延遲數分鐘)
  workflow_dispatch: # 可到 GitHub Actions 頁面點 Run workflow 立即測試

# 同時間只跑一個,避免重複掃描與重複通知
concurrency:
  group: poll-funbox
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan Funbox and report to Cloudflare Worker
        run: node poller/run.mjs --once
        env:
          WORKER_URL: ${{ secrets.WORKER_URL || 'https://funbox-watch.s1688334.workers.dev' }}
          POLLER_TOKEN: ${{ secrets.POLLER_TOKEN || secrets.ADMIN_TOKEN }}
          BUY_ENABLED: "0"
