name: poll-funbox

on:
  schedule:
    - cron: "*/5 * * * *" # GitHub 最短 5 分鐘;實際執行時間常會延遲幾分鐘
  workflow_dispatch: # 也可以到 Actions 頁面手動按 Run workflow

# 同時間只跑一個,避免重複通知
concurrency:
  group: poll-funbox
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Poll Funbox and report to Worker
        run: node poller/run.mjs
        env:
          WORKER_URL: https://funbox-watch.s1688334.workers.dev
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
