name: poll-funbox

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: poll-funbox
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan Funbox and report to Worker
        run: node poller/run.mjs --once
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          POLLER_TOKEN: ${{ secrets.POLLER_TOKEN || secrets.ADMIN_TOKEN }}
          BUY_ENABLED: "0"
